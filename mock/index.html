<html lang="ko"><head><meta charset="utf-8"><meta name="color-scheme" content="light">

<style>
:root{--bg:#fff;--fg:#1f2937;--card:#fff;--bd:#e5e7eb;--mut:#6b7280;--pri:#0f766e;--ok:#d1fae5;--okb:#10b981;--bad:#fee2e2;--badb:#ef4444;--sel:#e0f2fe;--selb:#0284c7;--exp:#f3f4f6}
html{-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
body{font-family:system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;max-width:880px;margin:0 auto;padding:20px;line-height:1.6;color:var(--fg);background:var(--bg);overflow-wrap:break-word}
a{color:var(--pri)}
h1{font-size:24px;margin:0 0 4px}.sub{color:var(--mut);font-size:14px;margin:0 0 14px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 6px;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:5}
.tab{flex:1;min-width:58px;padding:10px 6px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--fg);cursor:pointer;font:inherit;font-size:15px}
.tab.on{background:var(--pri);color:#fff;border-color:var(--pri);font-weight:700}
.tab small{display:block;font-size:11px;opacity:.85}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0 10px;font-size:14px;color:var(--mut)}
h2{font-size:19px;border-bottom:2px solid var(--pri);padding-bottom:4px;margin:30px 0 10px}
.passage{background:var(--card);border:1px solid var(--bd);border-left:4px solid var(--pri);border-radius:10px;padding:12px 14px;margin:14px 0 8px;font-size:15px}
.passage b.t{display:block;margin-bottom:4px;color:var(--pri)}
.q{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px 14px;margin:10px 0}
.q .qt{margin-bottom:6px}.q .no{font-weight:700;margin-right:4px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.opts button{padding:10px 12px;min-height:44px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--fg);cursor:pointer;text-align:left;font:inherit;font-size:15px}
.opts button:hover{border-color:var(--selb)}
.opts button.sel{background:var(--sel);border-color:var(--selb)}
.opts button.ok{background:var(--ok);border-color:var(--okb)}
.opts button.bad{background:var(--bad);border-color:var(--badb)}
.exp{display:none;margin-top:8px;font-size:14px;background:var(--exp);padding:8px 10px;border-radius:8px}
.q.done .exp{display:block}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}
.btn{padding:12px 18px;min-height:46px;border-radius:8px;border:1px solid var(--pri);background:var(--pri);color:#fff;font:inherit;font-size:16px;cursor:pointer}
.btn.sec{background:var(--card);color:var(--pri)}
.result{display:none;background:var(--card);border:2px solid var(--pri);border-radius:12px;padding:14px 16px;margin:14px 0;font-size:17px}
.result b{color:var(--pri);font-size:22px}
.omr{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px;margin:8px 0}
.omr a{display:block;text-align:center;padding:6px 0;border:1px solid var(--bd);border-radius:6px;text-decoration:none;color:var(--fg);font-size:13px;background:var(--card)}
.omr a.an{background:var(--sel);border-color:var(--selb)}
.omr a.ok{background:var(--ok);border-color:var(--okb)}.omr a.bad{background:var(--bad);border-color:var(--badb)}
.omr a small{display:block;color:var(--mut);font-size:11px}
@media(max-width:600px){body{padding:14px 12px}h1{font-size:20px}h2{font-size:17px}.opts{grid-template-columns:1fr}}
</style></head><body>

<script>
const R=[{"vocab": [{"q": "The city council voted to ______ the old bridge next spring.", "o": ["remove", "repair", "declare", "destroy"], "a": 1, "e": "repair – 수리하다 (300)"}, {"q": "Doctors say regular exercise can ______ heart disease.", "o": ["publish", "prepare", "prevent", "compare"], "a": 2, "e": "prevent – 막다, 방지하다 (300)"}, {"q": "The manager promised to ______ the staff that no jobs would be lost.", "o": ["announce", "assure", "reject", "declare"], "a": 1, "e": "assure – 장담하다, 확신시키다 (DAY01)"}, {"q": "The new law will ______ all citizens equal access to public services.", "o": ["adopt", "remind", "ensure", "consider"], "a": 2, "e": "ensure – 보장하다 (DAY01)"}, {"q": "The company decided to ______ a smaller rival firm to expand into Asia.", "o": ["acquire", "adopt", "announce", "assure"], "a": 0, "e": "acquire – 인수하다, 획득하다 (DAY01)"}, {"q": "The government will ______ a new policy to reduce plastic waste.", "o": ["afford", "admire", "appoint", "adopt"], "a": 3, "e": "adopt – 채택하다 (DAY01)"}, {"q": "The farmers asked for ______ to help rebuild their land after the flood.", "o": ["features", "funds", "figures", "foreigners"], "a": 1, "e": "funds – 기금, 자금 (300)"}, {"q": "Because of the heavy snow, all flights to Seoul were ______.", "o": ["canceled", "celebrated", "collected", "complained"], "a": 0, "e": "cancel – 취소하다 (300)"}, {"q": "Many scientists ______ the old theory after the new evidence was found.", "o": ["respected", "recruited", "rejected", "released"], "a": 2, "e": "reject – 거절하다, 거부하다 (300)"}, {"q": "Investors prefer ______ investments that offer stable returns.", "o": ["ordinary", "bold", "comfortable", "secure"], "a": 3, "e": "secure – 안전한 (DAY01)"}, {"q": "Ms. Kim was ______ as the new head of the marketing department.", "o": ["advised", "appointed", "attended", "arranged"], "a": 1, "e": "appoint – 임명하다 (DAY01)"}, {"q": "Police are currently ______ the cause of the fire.", "o": ["explaining", "accepting", "attending", "investigating"], "a": 3, "e": "investigate – 조사하다 (DAY01)"}, {"q": "The report ______ that sales will grow next year.", "o": ["depends", "indicates", "describes", "declines"], "a": 1, "e": "indicate – 나타내다, 보여주다 (DAY01)"}, {"q": "Please ______ your shoes before entering the house.", "o": ["remove", "reveal", "rescue", "return"], "a": 0, "e": "remove – 제거하다, 벗다 (DAY01)"}, {"q": "The writer ______ the truth about the scandal in her new book.", "o": ["reserved", "returned", "responded", "revealed"], "a": 3, "e": "reveal – 드러내다, 밝히다 (DAY01)"}], "passages": [{"title": "Passage 1 — Library Renovation", "text": "The Riverside Public Library announced that it will undergo a major renovation next year. The project is necessary to improve access to digital resources and to make the building safe for elderly visitors. According to the director, the library will remain open during most of the work, although some areas will be temporarily closed. The city has already secured a large fund for the project, and it expects the new building to attract more young people. Local residents were encouraged to share their ideas through an online survey before the design is finalized.", "qs": [{"q": "What is the main purpose of the article?", "o": ["To criticize the city's budget", "To announce a planned renovation of a library", "To ask readers to volunteer", "To report a new library director"], "a": 1, "e": "첫 문장에서 도서관 개보수 계획을 발표한다고 밝힘."}, {"q": "According to the article, why is the renovation necessary?", "o": ["to sell the building", "to reduce the number of staff", "to change the library's name", "to improve access to digital resources and make the building safe"], "a": 3, "e": "‘necessary to improve access … and make the building safe’ 그대로 요지 확인."}, {"q": "The word \"secured\" in the passage is closest in meaning to:", "o": ["lost", "reviewed", "obtained", "planned"], "a": 2, "e": "secure(확보하다) = obtain(얻다)."}, {"q": "What can be inferred about the library during the renovation?", "o": ["It will mostly stay open.", "It will be closed entirely.", "It will move to another city.", "It will stop offering online services."], "a": 0, "e": "‘remain open during most of the work’ → 대부분 개방 유지."}, {"q": "What does \"it\" refer to in \"it expects the new building to attract more young people\"?", "o": ["the library", "the city", "the survey", "the director"], "a": 1, "e": "‘The city has already secured … and it expects’ → it = the city."}]}, {"title": "Passage 2 — Email from Human Resources", "text": "From: Daniel Park, Human Resources. To: All staff. Subject: New customer service training. Starting next Monday, the company will launch a training program designed to increase customer satisfaction. Although the initial sessions are optional, all managers are required to attend. The program has several benefits, including better communication skills and a clearer understanding of company policy. Participants will also learn how to deal with difficult customers. If you have a conflict with your schedule, please contact me before Friday. I am confident that everyone will find the course useful.", "qs": [{"q": "What is the purpose of the email?", "o": ["to request a schedule change", "to report customer complaints", "to ask for budget approval", "to announce a new training program"], "a": 3, "e": "‘the company will launch a training program’ 공지."}, {"q": "Who is required to attend the initial sessions?", "o": ["new employees", "all employees", "managers", "customers"], "a": 2, "e": "‘all managers are required to attend’."}, {"q": "The word \"initial\" is closest in meaning to:", "o": ["final", "first", "expensive", "secret"], "a": 1, "e": "initial(처음의) = first(첫)."}, {"q": "According to the email, what should staff do if they have a conflict with their schedule?", "o": ["skip the course", "cancel the training", "ask a manager to attend for them", "contact Daniel before Friday"], "a": 3, "e": "‘please contact me before Friday’."}, {"q": "What can be inferred about Daniel Park?", "o": ["He works in sales.", "He will attend only the final session.", "He is responsible for the training program.", "He is a customer."], "a": 2, "e": "HR 담당자이며 교육을 직접 안내함."}]}, {"title": "Passage 3 — A Famous Musician", "text": "Hana Lee, a famous musician, received an award last night for her latest album. In her speech, she thanked the teachers who encouraged her to pursue music seriously. Lee began playing piano at the age of six and later joined a national youth orchestra. Critics describe her style as bold and charming, and her performances have attracted fans around the world. She said that she hopes to use her success to support young artists from rural areas. Lee will perform at the national stadium next month, and tickets are available online.", "qs": [{"q": "What is the article mainly about?", "o": ["A new national stadium", "The history of the piano", "A musician who won an award and plans a performance", "Teachers in rural areas"], "a": 2, "e": "수상 소식과 공연 계획이 중심."}, {"q": "The word \"bold\" is closest in meaning to:", "o": ["boring", "tiny", "daring", "pale"], "a": 2, "e": "bold(대담한) = daring(과감한)."}, {"q": "When did Lee begin playing the piano?", "o": ["last night", "at six", "next month", "in rural areas"], "a": 1, "e": "‘began playing piano at the age of six’."}, {"q": "What does Lee hope to do?", "o": ["to sell her album", "to move abroad", "to join a sports club", "to support young artists from rural areas"], "a": 3, "e": "‘hopes to use her success to support young artists from rural areas’."}, {"q": "What does \"tickets are available online\" imply?", "o": ["fans can buy tickets over the internet", "tickets are sold out", "the event was canceled", "tickets are free for everyone"], "a": 0, "e": "available = 이용 가능한 → 온라인 구매 가능."}]}]}, {"vocab": [{"q": "The team leader asked everyone to ______ their progress reports by Thursday.", "o": ["collect", "compare", "complete", "consider"], "a": 2, "e": "complete – 완료하다 (300)"}, {"q": "Scientists are trying to ______ the results with earlier studies.", "o": ["prepare", "repair", "declare", "compare"], "a": 3, "e": "compare – 비교하다 (300)"}, {"q": "Protective clothing is ______ for workers in the chemical factory.", "o": ["ordinary", "private", "daily", "necessary"], "a": 3, "e": "necessary – 필요한 (300)"}, {"q": "Please ______ me if you cannot attend the meeting.", "o": ["contact", "conduct", "consent", "consume"], "a": 0, "e": "contact – 연락하다 (300)"}, {"q": "The family's ______ increased after the father was promoted.", "o": ["incident", "ingredient", "income", "initial"], "a": 2, "e": "income – 수입, 소득 (DAY01)"}, {"q": "Many students ______ the final exam because they did not study enough.", "o": ["flew", "filled", "failed", "forgot"], "a": 2, "e": "fail – 실패하다, 떨어지다 (300)"}, {"q": "The restaurant decided to ______ the price of its lunch menu.", "o": ["inform", "insist", "invade", "increase"], "a": 3, "e": "increase – 늘리다, 증가하다 (300)"}, {"q": "The museum will ______ a new exhibition about ancient Egypt next month.", "o": ["dismiss", "display", "discover", "distribute"], "a": 1, "e": "display – 전시하다 (300)"}, {"q": "The students were ______ to take part in the science fair.", "o": ["embarrassed", "encouraged", "exchanged", "exhausted"], "a": 1, "e": "encourage – 격려하다, 장려하다 (300)"}, {"q": "She ______ the event in detail in her letter.", "o": ["destroyed", "described", "delivered", "dressed"], "a": 1, "e": "describe – 묘사하다 (300)"}, {"q": "Japanese cars are known for their high ______ and reliability.", "o": ["quantity", "quarter", "quality", "quest"], "a": 2, "e": "quality – 품질 (300)"}, {"q": "The two companies share a ______ goal: reducing waste.", "o": ["comfortable", "complicated", "competitive", "common"], "a": 3, "e": "common – 공통의 (300)"}, {"q": "The manager ______ the team through a very difficult year.", "o": ["led", "lent", "lost", "let"], "a": 0, "e": "lead – 이끌다 (300)"}, {"q": "It is ______ to find a good job without any experience.", "o": ["dependent", "dramatic", "difficult", "delicious"], "a": 2, "e": "difficult – 어려운 (300)"}, {"q": "The bank ______ a loan of $5,000 to the young entrepreneur.", "o": ["opened", "ordered", "owned", "offered"], "a": 3, "e": "offer – 제공하다 (300)"}], "passages": [{"title": "Passage 1 — A New Weekend Market", "text": "The city's first weekend market for local farmers opened last Saturday in the downtown area. Organizers say the market was designed to support small businesses and to offer fresh food at fair prices. Several farmers from nearby regions sold vegetables, dairy products, and handmade goods. Visitors were encouraged to bring reusable bags, and the organizers hope to reduce plastic waste. Although the first day was rainy, it attracted more than two thousand people. The market will continue every weekend until the end of the year, and organizers plan to add a food court in the spring.", "qs": [{"q": "What is the article mainly about?", "o": ["a farming problem", "a new weekend market", "a city's new bus route", "a food festival in spring"], "a": 1, "e": "새로 열린 주말 시장 소개."}, {"q": "According to the article, why was the market created?", "o": ["to attract tourists from abroad", "to replace local stores", "to sell expensive goods", "to support small businesses and offer fresh food"], "a": 3, "e": "‘designed to support small businesses and to offer fresh food’."}, {"q": "The word \"designed\" is closest in meaning to:", "o": ["avoided", "advertised", "planned", "closed"], "a": 2, "e": "designed(계획된) = planned."}, {"q": "What can be inferred about the market?", "o": ["It is only open on rainy days.", "It will be closed next year.", "It sells only plastic products.", "It will likely grow in the future."], "a": 3, "e": "음식 코트 추가 계획 → 확장 가능성."}, {"q": "What does \"it\" refer to in \"it attracted more than two thousand people\"?", "o": ["the farmers", "the weather", "the food court", "the market"], "a": 3, "e": "앞 문장의 주어인 the market."}]}, {"title": "Passage 2 — Notice to Parents", "text": "Notice to Parents: The annual Sports Day will take place on May 15 at the city stadium. All students are required to attend, and parents are invited to join the events. Students who wish to take part in the relay race must register with their homeroom teacher by Friday. The school will provide water and snacks, but students should bring their own hats and sunscreen. In the event of rain, the program will be postponed until May 22. Parents who cannot attend are asked to inform the school office in advance.", "qs": [{"q": "Why is this notice written?", "o": ["to ask for money", "to hire new teachers", "to give information about an annual event", "to cancel a school trip"], "a": 2, "e": "연례 체육대회 안내."}, {"q": "What must students do if they want to join the relay race?", "o": ["practice for a month", "pay a fee", "bring their parents", "register with their homeroom teacher by Friday"], "a": 3, "e": "‘must register with their homeroom teacher by Friday’."}, {"q": "The word \"postponed\" is closest in meaning to:", "o": ["enlarged", "repaired", "delayed", "reported"], "a": 2, "e": "postpone = delay(연기하다)."}, {"q": "What will happen if it rains?", "o": ["students will stay home", "the event will be canceled forever", "parents will pay", "the event will be postponed to May 22"], "a": 3, "e": "‘postponed until May 22’."}, {"q": "What does \"they\" refer to in \"students should bring their own hats\"?", "o": ["teachers", "staff", "students", "parents"], "a": 2, "e": "행사 참가 대상인 학생."}]}, {"title": "Passage 3 — Coral Reefs and a Young Scientist", "text": "Dr. Mina Choi, a young scientist, has been studying the effects of climate change on coral reefs for ten years. Her team recently discovered that some coral species are able to survive higher temperatures than previously thought. Although the discovery is encouraging, she warns that the overall situation remains serious. Coral reefs provide homes for many marine animals, and their loss would affect fishing communities around the world. Dr. Choi hopes that her findings will persuade governments to adopt stricter policies on pollution. She also believes that ordinary people can help by reducing their use of plastic.", "qs": [{"q": "What is the main idea of the passage?", "o": ["Governments have banned plastic", "Coral reefs are becoming popular with tourists", "Fishing communities are closing", "A scientist's research shows some coral can survive heat, though the situation remains serious"], "a": 3, "e": "연구 결과와 여전히 심각한 상황을 전달."}, {"q": "The word \"previously\" is closest in meaning to:", "o": ["often", "finally", "before", "recently"], "a": 2, "e": "previously(이전에) = before."}, {"q": "According to Dr. Choi, what would be the effect of losing coral reefs?", "o": ["It will help marine animals.", "It will reduce tourism only.", "It will make the ocean cooler.", "It would affect fishing communities around the world."], "a": 3, "e": "‘their loss would affect fishing communities around the world’."}, {"q": "What does \"findings\" refer to?", "o": ["her students", "her research results", "her salary", "her books"], "a": 1, "e": "연구 결과(findings)."}, {"q": "What can be inferred about Dr. Choi?", "o": ["She works only in fishing communities.", "She opposes scientific research.", "She plans to retire next year.", "She wants governments to act on pollution."], "a": 3, "e": "정부가 오염 정책을 강화하길 바람."}]}]}, {"vocab": [{"q": "The city plans to ______ a new subway line by 2030.", "o": ["bill", "bind", "build", "blend"], "a": 2, "e": "build – 짓다, 세우다 (300)"}, {"q": "The doctor ______ him to rest for at least two weeks.", "o": ["admitted", "admired", "adjusted", "advised"], "a": 3, "e": "advise – 조언하다 (300)"}, {"q": "The ______ of the event is to raise money for children's hospitals.", "o": ["process", "progress", "purpose", "promise"], "a": 2, "e": "purpose – 목적 (300)"}, {"q": "Tickets for the concert are ______ on the official website.", "o": ["avoidable", "valuable", "reliable", "available"], "a": 3, "e": "available – 이용 가능한 (300)"}, {"q": "The new robot has the ______ to lift heavy boxes.", "o": ["activity", "availability", "authority", "ability"], "a": 3, "e": "ability – 능력 (DAY01)"}, {"q": "The company ______ its profits by 20 percent last year.", "o": ["increased", "inherited", "interested", "invented"], "a": 0, "e": "increase – 증가하다 (300)"}, {"q": "Each ______ of the machine must be checked regularly.", "o": ["part", "paper", "pattern", "pride"], "a": 0, "e": "part – 부분, 부품 (DAY01)"}, {"q": "The team will ______ against Japan in the final match.", "o": ["play", "pray", "plan", "pay"], "a": 0, "e": "play – 경기하다 (300)"}, {"q": "Researchers ______ the ancient ruins to learn how people lived there.", "o": ["exceeded", "excited", "examined", "exchanged"], "a": 2, "e": "examine – 조사하다 (300)"}, {"q": "The old man ______ his whole life in a small village.", "o": ["stored", "spent", "sold", "sent"], "a": 1, "e": "spend – 보내다, 쓰다 (300)"}, {"q": "The company's ______ in Seoul is responsible for all sales in Korea.", "o": ["branch", "brand", "bridge", "brief"], "a": 0, "e": "branch – 지점 (300)"}, {"q": "Teachers often ______ students to read books in English every day.", "o": ["enclose", "engage", "encourage", "enjoy"], "a": 2, "e": "encourage – 격려하다 (300)"}, {"q": "The new policy will ______ employees from using personal phones at work.", "o": ["prevent", "prepare", "present", "preserve"], "a": 0, "e": "prevent – 막다 (300)"}, {"q": "Tom ______ every effort to finish the report on time.", "o": ["took", "gave", "made", "did"], "a": 2, "e": "make an effort – 노력하다 (300)"}, {"q": "Please ______ the form and return it to the front desk.", "o": ["compete", "complete", "compare", "compose"], "a": 1, "e": "complete – 작성하다, 완료하다 (300)"}], "passages": [{"title": "Passage 1 — Job Opening", "text": "The Seoul branch of Bright Living Company is looking for a marketing assistant. The successful candidate will be responsible for designing advertisements and analyzing customer data. Applicants should have at least two years of experience and a good understanding of social media. Fluency in English is preferred but not required. The position is a full-time job with a competitive salary and health benefits. Applications must be submitted online by March 31. Only candidates selected for an interview will be contacted.", "qs": [{"q": "What is the purpose of the notice?", "o": ["to describe a new product", "to announce a company merger", "to invite customers to an event", "to advertise a job opening"], "a": 3, "e": "마케팅 보조 채용 공고."}, {"q": "What is required of applicants?", "o": ["no experience", "fluent English", "a degree from abroad", "at least two years of experience and social media knowledge"], "a": 3, "e": "‘at least two years of experience and a good understanding of social media’. 영어 유창성은 우대만."}, {"q": "The word \"responsible\" is closest in meaning to:", "o": ["afraid of", "free from", "in charge of", "interested in"], "a": 2, "e": "responsible for = in charge of(담당하는)."}, {"q": "Who will be contacted by the company?", "o": ["customers", "all applicants", "only English speakers", "only candidates selected for an interview"], "a": 3, "e": "‘Only candidates selected for an interview will be contacted.’"}, {"q": "What can be inferred about the company?", "o": ["It only accepts applications by phone.", "It is hiring for a temporary position.", "It is looking for an employee to help with advertising and data work.", "It will close the Seoul branch."], "a": 2, "e": "광고 디자인과 데이터 분석 담당 채용."}]}, {"title": "Passage 2 — A Restaurant Review", "text": "Sunny Kitchen opened in the historic district last month and has quickly become popular with local families. The menu offers a mix of traditional and modern dishes, and the chef uses only fresh ingredients from nearby farms. The staff are friendly and attentive, although the service can be slow during lunch hours. Prices are reasonable for the quality, but the portions are small. The interior is comfortable and bright, making it a good place for a casual meal. Overall, I would highly recommend the restaurant to anyone who enjoys natural flavors.", "qs": [{"q": "What is the writer's overall opinion of the restaurant?", "o": ["generally positive, with some complaints", "very negative", "indifferent", "strongly against"], "a": 0, "e": "장점을 칭찬하고 단점도 언급 → 대체로 긍정적."}, {"q": "What is one weakness mentioned in the review?", "o": ["the chef is unfriendly", "prices are too high", "service can be slow during lunch hours", "the interior is dark"], "a": 2, "e": "‘service can be slow during lunch hours’."}, {"q": "The word \"attentive\" is closest in meaning to:", "o": ["noisy", "lazy", "careful", "boring"], "a": 2, "e": "attentive(세심한) = careful."}, {"q": "What can be inferred about Sunny Kitchen?", "o": ["It will close soon.", "It is likely to remain popular.", "It serves only desserts.", "It is located far from town."], "a": 1, "e": "지역 가족들에게 인기가 많음."}, {"q": "To whom does the writer recommend the restaurant?", "o": ["people who want a fast meal", "people who travel often", "people who like spicy food", "people who enjoy natural flavors"], "a": 3, "e": "‘recommend … to anyone who enjoys natural flavors’."}]}, {"title": "Passage 3 — Electric Buses", "text": "The city has announced plans to replace its old diesel buses with electric ones by 2030. The project is expected to cost about 500 million dollars, and the government has agreed to provide part of the funding. Officials believe the change will reduce air pollution and lower fuel costs in the long run. However, some residents have expressed concern that the cost could increase taxes. The transport department insists that the new buses are safe and reliable, and it plans to hold public meetings to answer questions. Construction of the charging stations will begin next year.", "qs": [{"q": "What is the article mainly about?", "o": ["a hospital", "a tax increase", "a city's plan to switch to electric buses", "a new road project"], "a": 2, "e": "디젤 버스를 전기 버스로 교체하는 계획."}, {"q": "Which benefit of the project is mentioned?", "o": ["fewer buses", "more traffic", "higher taxes", "lower air pollution"], "a": 3, "e": "‘reduce air pollution and lower fuel costs’."}, {"q": "The word \"insists\" is closest in meaning to:", "o": ["forgets", "doubts", "hopes", "claims strongly"], "a": 3, "e": "insist(주장하다) = claim strongly."}, {"q": "What is the concern of some residents?", "o": ["the stations are too big", "the buses are too slow", "the route is too long", "the cost could raise taxes"], "a": 3, "e": "‘the cost could increase taxes’."}, {"q": "What will begin next year?", "o": ["taxes are reduced", "buses are removed", "public meetings begin", "construction of charging stations begins"], "a": 3, "e": "‘Construction of the charging stations will begin next year.’"}]}]}, {"vocab": [{"q": "The children were ______ to the zoo by their grandparents.", "o": ["token", "tasted", "taken", "tipped"], "a": 2, "e": "take – 데려가다 (300)"}, {"q": "The company will ______ its new product in June.", "o": ["launch", "lunch", "laugh", "lower"], "a": 0, "e": "launch – 출시하다 (300)"}, {"q": "The results of the survey ______ that most people prefer online shopping.", "o": ["indicate", "inform", "insist", "inspire"], "a": 0, "e": "indicate – 나타내다 (DAY01)"}, {"q": "The new computer system ______ a large amount of data very quickly.", "o": ["processes", "produces", "protects", "promotes"], "a": 0, "e": "process – 처리하다 (300)"}, {"q": "Water is ______ for all living things.", "o": ["necessary", "normal", "nervous", "nasty"], "a": 0, "e": "necessary – 필요한 (300)"}, {"q": "The company ______ a new partnership with a Korean firm.", "o": ["answered", "announced", "appealed", "arranged"], "a": 1, "e": "announce – 발표하다 (300)"}, {"q": "Please ______ your bag under the seat during the flight.", "o": ["keen", "keep", "kneel", "knock"], "a": 1, "e": "keep – 유지하다, 보관하다 (300)"}, {"q": "The nurse will ______ the patient's medical records.", "o": ["exhibit", "exceed", "examine", "expand"], "a": 2, "e": "examine – 검토하다 (300)"}, {"q": "The town is famous for its ______ architecture.", "o": ["ancient", "active", "abstract", "accurate"], "a": 0, "e": "ancient – 고대의 (300)"}, {"q": "The team spent a week ______ the data from the experiment.", "o": ["alarming", "analyzing", "allowing", "annoying"], "a": 1, "e": "analyze – 분석하다 (300)"}, {"q": "Farmers should ______ the soil to keep it healthy.", "o": ["protect", "project", "predict", "prefer"], "a": 0, "e": "protect – 보호하다 (300)"}, {"q": "The store will ______ the goods to customers' homes for free.", "o": ["deliberate", "deliver", "delight", "defend"], "a": 1, "e": "deliver – 배달하다 (300)"}, {"q": "A strange ______ was found at the bottom of the river.", "o": ["object", "objective", "observer", "obstacle"], "a": 0, "e": "object – 물체 (300)"}, {"q": "The new design was ______ by a famous architect from Italy.", "o": ["denied", "designed", "destroyed", "deserved"], "a": 1, "e": "design – 설계하다 (300)"}, {"q": "She is always ______ of her health and eats well.", "o": ["aware", "awake", "afraid", "alike"], "a": 0, "e": "aware – 알고 있는 (DAY01)"}], "passages": [{"title": "Passage 1 — The Ancient City of Petra", "text": "Petra, an ancient city in Jordan, was built by the Nabataean people more than two thousand years ago. Its buildings were carved directly into red stone cliffs, which helped protect them from the desert heat. For centuries the city was forgotten by the outside world until a Swiss explorer rediscovered it in 1812. Today, it attracts thousands of visitors each year, and researchers continue to analyze its structures to understand how the Nabataeans managed water. Some experts warn that tourism could damage the site if the number of visitors is not controlled.", "qs": [{"q": "What is the main topic of the passage?", "o": ["desert animals", "Swiss explorers", "an ancient city and its history", "a modern city in Jordan"], "a": 2, "e": "고대 도시 페트라의 역사와 현황."}, {"q": "How were the buildings in Petra protected from the heat?", "o": ["by steel walls", "underground", "by tourists", "carved into stone cliffs that protected them from heat"], "a": 3, "e": "‘carved directly into red stone cliffs’."}, {"q": "The word \"rediscovered\" is closest in meaning to:", "o": ["built", "destroyed", "painted", "found again"], "a": 3, "e": "re-discover = 다시 발견하다."}, {"q": "What concern is mentioned in the passage?", "o": ["old roads", "too much rain", "lack of visitors", "tourism could damage the site"], "a": 3, "e": "‘tourism could damage the site’."}, {"q": "What can be inferred about the researchers?", "o": ["They want to close the city.", "They are tourists.", "They study how the city managed water.", "They build new cities."], "a": 2, "e": "Nabataean의 물 관리 방식을 연구 중."}]}, {"title": "Passage 2 — Hotel Booking Confirmation", "text": "Thank you for booking with Blue Harbor Hotel. Your reservation for a double room from June 3 to June 6 has been confirmed. Breakfast is included in your rate and is served from 7 to 10 a.m. in the main dining hall. Please note that the hotel does not provide parking, but a public garage is located two blocks away. If you need to cancel, please notify us at least 48 hours in advance to avoid a charge. Guests may also request airport transfers, which cost 30 dollars per trip and must be arranged before arrival.", "qs": [{"q": "What is the purpose of the email?", "o": ["to sell travel insurance", "to offer a job", "to complain about a room", "to confirm a hotel reservation"], "a": 3, "e": "예약 확인 메일."}, {"q": "What is included in the room rate?", "o": ["room service", "airport transfer", "parking", "breakfast"], "a": 3, "e": "‘Breakfast is included in your rate’."}, {"q": "The word \"notify\" is closest in meaning to:", "o": ["refuse", "forget", "inform", "remember"], "a": 2, "e": "notify = inform(알리다)."}, {"q": "What should a guest do to cancel without a charge?", "o": ["pay a fee", "email the airport", "call on the day of arrival", "notify the hotel at least 48 hours in advance"], "a": 3, "e": "‘notify us at least 48 hours in advance’."}, {"q": "What can be inferred about the hotel?", "o": ["It has its own parking garage.", "It charges for breakfast.", "It is located in the airport.", "It does not have its own parking."], "a": 3, "e": "‘does not provide parking’."}]}, {"title": "Passage 3 — A New School Program", "text": "Students at Maple High School will begin a new program next semester that combines classroom learning with practical work experience. Under the program, students will spend two afternoons each week working at local companies. The school believes that real-life experience will help students discover their interests and develop useful skills. Teachers have been concerned that some students may fall behind in class, so the program includes extra tutoring sessions. Parents are encouraged to attend a briefing on March 10 to learn more about the program's requirements.", "qs": [{"q": "What is the article mainly about?", "o": ["a school sports event", "an increase in school fees", "a new school program that mixes study and work experience", "a change in exam dates"], "a": 2, "e": "학업과 현장 경험을 결합한 새 프로그램."}, {"q": "How many afternoons per week will students spend working?", "o": ["three", "one", "five", "two"], "a": 3, "e": "‘two afternoons each week’."}, {"q": "The word \"briefing\" is closest in meaning to:", "o": ["test", "party", "vacation", "meeting for information"], "a": 3, "e": "briefing = 설명회."}, {"q": "Why did the school include extra tutoring sessions?", "o": ["to save money", "for sports practice", "to reduce homework", "because some students may fall behind"], "a": 3, "e": "‘some students may fall behind in class’."}, {"q": "What is suggested about parents?", "o": ["they cannot visit the school", "they are not allowed to ask questions", "they must pay for the program", "they are encouraged to attend the briefing"], "a": 3, "e": "‘Parents are encouraged to attend a briefing’."}]}]}, {"vocab": [{"q": "The workers will ______ the old building next month.", "o": ["describe", "deliver", "destroy", "disturb"], "a": 2, "e": "destroy – 파괴하다 (300)"}, {"q": "Drivers should ______ the main road during rush hour.", "o": ["avoid", "avert", "adopt", "assume"], "a": 0, "e": "avoid – 피하다 (300)"}, {"q": "The ______ of the trip was too high for most students.", "o": ["cost", "cause", "course", "count"], "a": 0, "e": "cost – 비용 (300)"}, {"q": "The teacher's ______ was to make learning fun for every student.", "o": ["aid", "aim", "arm", "ash"], "a": 1, "e": "aim – 목표 (DAY01)"}, {"q": "The painter is ______ for his bold use of colors.", "o": ["familiar", "faithful", "famous", "fashionable"], "a": 2, "e": "famous – 유명한 (300)"}, {"q": "This new smartphone has several ______ features, such as a foldable screen.", "o": ["unique", "useless", "united", "upset"], "a": 0, "e": "unique – 독특한 (300)"}, {"q": "The government ______ a state of emergency after the flood.", "o": ["decided", "declared", "described", "dedicated"], "a": 1, "e": "declare – 선언하다 (DAY01)"}, {"q": "The sales team consists of ______ members.", "o": ["seven", "several", "severe", "sever"], "a": 1, "e": "several – 몇몇의 (300)"}, {"q": "Could you please ______ me to the nearest station?", "o": ["lead", "lend", "learn", "leave"], "a": 0, "e": "lead – 안내하다 (300)"}, {"q": "The students ______ in the science competition.", "o": ["participated", "protected", "prepared", "presented"], "a": 0, "e": "participate in – 참가하다 (300)"}, {"q": "Many workers ______ injuries in the accident.", "o": ["suffered", "supported", "supplied", "suggested"], "a": 0, "e": "suffer – 겪다 (DAY01)"}, {"q": "She ______ a famous singer after winning the national contest.", "o": ["begun", "became", "belonged", "broke"], "a": 1, "e": "become – ~이 되다 (300)"}, {"q": "The hotel ______ a free breakfast to all guests.", "o": ["opens", "offers", "orders", "owns"], "a": 1, "e": "offer – 제공하다 (300)"}, {"q": "The new manager ______ the old system completely.", "o": ["reviewed", "replaced", "reserved", "resigned"], "a": 1, "e": "replace – 교체하다 (단어장 외)"}, {"q": "The team leader ______ the project to the board next week.", "o": ["presents", "presence", "presses", "prevents"], "a": 0, "e": "present – 발표하다 (300)"}], "passages": [{"title": "Passage 1 — A New Space Exhibit", "text": "The National Science Museum will open a new exhibit on space exploration next Friday. The exhibit features a full-size model of a rocket and a collection of photographs taken by astronauts. Visitors can also try a virtual reality simulation that allows them to walk on the surface of the moon. Admission to the exhibit is included with the regular museum ticket. Because the exhibit is expected to be popular, the museum recommends booking a time slot online. The museum director said the goal is to inspire young people to pursue careers in science and engineering.", "qs": [{"q": "What is the article mainly about?", "o": ["a school science fair", "a museum closing for repairs", "a ticket price increase", "a new exhibit about space exploration"], "a": 3, "e": "새 우주 탐사 전시 안내."}, {"q": "What is included in the regular museum ticket?", "o": ["an online booking service", "a rocket model to take home", "admission to the exhibit", "a virtual reality simulation only"], "a": 2, "e": "‘Admission to the exhibit is included with the regular museum ticket.’"}, {"q": "Why does the museum recommend booking a time slot online?", "o": ["because tickets are free", "because the simulation is broken", "because the museum is closing", "because the exhibit is expected to be popular"], "a": 3, "e": "인기가 많을 것으로 예상."}, {"q": "The word \"features\" is closest in meaning to:", "o": ["rejects", "forgets", "fears", "includes"], "a": 3, "e": "feature(포함하다) = include."}, {"q": "What is the director's goal?", "o": ["sell more tickets", "close the museum", "hire more staff", "inspire young people to pursue careers in science and engineering"], "a": 3, "e": "‘the goal is to inspire young people …’."}]}, {"title": "Passage 2 — Sitting and Health", "text": "Many office workers spend most of their day sitting, which can cause back pain and fatigue. Experts suggest that even short breaks can make a difference. Standing up every thirty minutes, for example, improves blood circulation and helps people stay focused. Some companies have introduced standing desks, and early results appear promising. However, researchers caution that standing for long periods is not a complete solution. Instead, they recommend alternating between sitting and standing, and taking regular walks whenever possible.", "qs": [{"q": "What is the main idea of the passage?", "o": ["Office chairs should be replaced.", "Walking is dangerous.", "Standing desks are too expensive.", "Short, regular breaks can help office workers stay healthy."], "a": 3, "e": "짧고 규칙적인 휴식의 효과."}, {"q": "What problem is caused by spending long periods sitting?", "o": ["back pain and fatigue", "sleep disorders only", "eye problems", "high blood pressure only"], "a": 0, "e": "‘can cause back pain and fatigue’."}, {"q": "The word \"promising\" is closest in meaning to:", "o": ["hopeful", "useless", "dangerous", "expensive"], "a": 0, "e": "promising(유망한) ≈ hopeful."}, {"q": "What do researchers recommend?", "o": ["sitting for longer periods", "standing all day", "avoiding walks", "alternating between sitting and standing"], "a": 3, "e": "‘recommend alternating between sitting and standing’."}, {"q": "What can be inferred from the passage?", "o": ["Walking causes back pain.", "Standing desks are a complete solution.", "Office workers never take breaks.", "Standing for long periods is not enough by itself."], "a": 3, "e": "‘is not a complete solution’."}]}, {"title": "Passage 3 — Water Shutdown Notice", "text": "Notice to residents: The water supply to Building B will be shut off on Saturday from 9 a.m. to 3 p.m. for pipe repairs. Residents are advised to store enough water for the day. The management office apologizes for the inconvenience and has arranged a temporary water station in the parking lot. Please note that the repair work may take longer if the weather is bad. Any residents with questions should contact the office before Friday.", "qs": [{"q": "What is the purpose of the notice?", "o": ["to report a crime", "to invite residents to a party", "to announce a building sale", "to inform residents about a water shutdown"], "a": 3, "e": "단수 공지."}, {"q": "When will the water be shut off?", "o": ["Sunday all day", "Monday evening", "Saturday from 9 a.m. to 3 p.m.", "Friday morning"], "a": 2, "e": "‘on Saturday from 9 a.m. to 3 p.m.’."}, {"q": "The word \"temporary\" is closest in meaning to:", "o": ["permanent", "expensive", "safe", "short-term"], "a": 3, "e": "temporary(임시의) = short-term."}, {"q": "What may happen if the weather is bad?", "o": ["the office will close", "residents will be charged", "the water will be restored early", "the repair work may take longer"], "a": 3, "e": "‘the repair work may take longer if the weather is bad’."}, {"q": "What can be inferred about the management office?", "o": ["It plans to sell the building.", "It does not care about residents.", "It will stop repairs on Saturday.", "It is trying to reduce inconvenience for residents."], "a": 3, "e": "임시 급수대 설치 등 불편 최소화 노력."}]}]}];
const CIRC=['①','②','③','④'];
let cur=0,ans={},graded={},t0=Date.now(),tick;
const KEY='gtelp-mock-v1';
function save(){try{localStorage.setItem(KEY,JSON.stringify({ans,graded}))}catch(e){}}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s){ans=s.ans||{};graded=s.graded||{}}}catch(e){}}
function flat(i){const r=R[i],out=[];r.vocab.forEach(q=>out.push(q));r.passages.forEach(p=>p.qs.forEach(q=>out.push(q)));return out}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function tabs(){const t=document.getElementById('tabs');t.innerHTML='';R.forEach((r,i)=>{const b=document.createElement('button');b.className='tab'+(i===cur?' on':'');const g=graded[i];b.innerHTML='제'+(i+1)+'회'+(g?'<small>'+g.score+'/30</small>':'');b.onclick=()=>{cur=i;t0=Date.now();render();scrollTo(0,0)};t.appendChild(b)})}
function qhtml(q,n){const A=ans[cur]||{};const g=graded[cur];const sel=A[n];
 let o=q.o.map((x,k)=>{let c='';if(g){if(k===q.a)c='ok';else if(sel===k)c='bad'}else if(sel===k)c='sel';return `<button class="${c}" data-n="${n}" data-k="${k}">${CIRC[k]} ${esc(x)}</button>`}).join('');
 return `<div class="q${g?' done':''}" id="q${n}"><div class="qt"><span class="no">${n+1}.</span>${esc(q.q)}</div><div class="opts">${o}</div><div class="exp"><b>정답 ${CIRC[q.a]} ${esc(q.o[q.a])}</b><br>${esc(q.e)}${g&&sel===undefined?'<br>(미응답)':''}</div></div>`}
function render(){tabs();const r=R[cur];let n=0,h='<h2>PART 1. Vocabulary (1–15)</h2>';
 r.vocab.forEach(q=>{h+=qhtml(q,n++)});
 h+='<h2>PART 2. Reading Comprehension (16–30)</h2>';
 r.passages.forEach(p=>{h+=`<div class="passage"><b class="t">${esc(p.title)}</b>${esc(p.text)}</div>`;p.qs.forEach(q=>{h+=qhtml(q,n++)})});
 document.getElementById('exam').innerHTML=h;
 document.querySelectorAll('.opts button').forEach(b=>b.onclick=()=>{if(graded[cur])return;const n=+b.dataset.n,k=+b.dataset.k;(ans[cur]=ans[cur]||{})[n]=k;save();
  b.parentNode.querySelectorAll('button').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');upd()});
 upd();showResult()}
function upd(){const A=ans[cur]||{};const f=flat(cur),g=graded[cur];
 document.getElementById('prog').textContent='답변 '+Object.keys(A).length+' / 30';
 document.getElementById('omr').innerHTML=f.map((q,n)=>{let c='';if(g)c=(A[n]===q.a)?'ok':'bad';else if(A[n]!==undefined)c='an';return `<a href="#q${n}" class="${c}">${n+1}<small>${A[n]!==undefined?CIRC[A[n]]:'-'}</small></a>`}).join('')}
function showResult(){const g=graded[cur];['result','result2'].forEach(id=>{const e=document.getElementById(id);if(!g){e.style.display='none';return}
 e.style.display='block';e.innerHTML=`제${cur+1}회 결과: <b>${g.score} / 30</b> (${Math.round(g.score/30*100)}점) · 어휘 ${g.v}/15 · 독해 ${g.r}/15 · 소요 ${g.time}<br><small>틀린 문제는 빨간색, 정답은 초록색으로 표시되고 해설이 열려 있습니다.</small>`})}
document.getElementById('grade').onclick=()=>{const A=ans[cur]||{};const f=flat(cur);const un=f.length-Object.keys(A).length;
 if(un>0&&!confirm('아직 풀지 않은 문제가 '+un+'개 있습니다. 그래도 채점할까요?'))return;
 let v=0,r=0;f.forEach((q,n)=>{if(A[n]===q.a){n<15?v++:r++}});
